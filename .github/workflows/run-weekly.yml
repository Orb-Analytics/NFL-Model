name: Weekly NFL Scoring

# Mirrors Orb-Analytics/MLB-Model's run-etl.yml pattern (daily -> weekly).
# Unlike the MLB model, no API key/secret is needed for odds: Novig's
# GraphQL endpoint (gql.novig.us) is public, same as the MLB client uses.
#
# Cron is set for Tuesday mornings -- NFL lines are typically posted by
# Monday night/Tuesday morning for the coming week's slate. Adjust if your
# actual line-posting timing differs once you've watched it for a few weeks.
on:
  schedule:
    - cron: '0 13 * * 2'  # Tuesday 9 AM ET (13:00 UTC) -- adjust for DST if needed

  workflow_dispatch: {}    # allows manual "Run workflow" from the Actions tab

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch latest historical + current-season data
      run: python scripts/01_fetch_historical.py

    - name: Score this week's games
      run: python scripts/25_live_weekly_scoring.py

    - name: Write predictions.json
      run: python scripts/26_write_predictions_json.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        # `git add` with explicit literal paths fails the whole step ("did
        # not match any files") if even ONE of them doesn't exist -- which
        # happened for real (live_novig_odds.csv wasn't written by
        # 25_live_weekly_scoring.py, now fixed, but ANY script exiting
        # early -- e.g. "no unplayed games", "no Novig odds matched" --
        # will still legitimately skip writing some of these files most
        # weeks). Add only what actually exists so a partial/early-return
        # run still commits whatever it did produce instead of crashing
        # this step entirely.
        for f in predictions.json data/processed/live_scoring_input.csv data/processed/live_picks.csv data/processed/live_novig_odds.csv; do
          if [ -f "$f" ]; then
            git add "$f"
          else
            echo "Skipping $f -- not written this run."
          fi
        done
        git diff --cached --quiet || (git commit -m "Weekly NFL predictions: $(date -u +%Y-%m-%d)" && git push)
